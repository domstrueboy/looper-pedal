[package]
name = "looper_pedal"
version = "0.1.3"
edition = "2024"

# Build-only, and the sole way to put an icon into a Windows executable:
# it drives the SDK's resource compiler. Nothing of it ships in the binary.
[build-dependencies]
winresource = "0.1"

[dependencies]
cpal = { version = "0.18.2", features = ["asio"] }
eframe = { version = "0.36.1", features = ["glow"] }
egui = "0.36.1"
ringbuf = "0.5.1"
